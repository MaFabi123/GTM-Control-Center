<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <base href="../">

    <title>GTM Control Center | Meisterschaft</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="assets/css/theme.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/navbar.css"
    >

    <link
        rel="stylesheet"
        href="assets/css/meisterschaft.css"
    >
</head>

<body>

    <header id="site-navbar"></header>

    <main class="meisterschaft-page">

        <section class="meisterschaft-hero">

            <div class="container">

                <p class="meisterschaft-eyebrow">
                    GTM Masters Saison 1
                </p>

                <h1>
                    Fahrerwertung
                </h1>

                <p class="meisterschaft-intro">
                    Aktuelle Meisterschaft der German Touring Masters.
                </p>

            </div>

        </section>

        <section class="meisterschaft-stats">

            <div class="container">

                <div class="meisterschaft-stat-grid">

                    <article class="meisterschaft-stat">

                        <strong id="stat-fahrer">
                            –
                        </strong>

                        <span>
                            Fahrer
                        </span>

                    </article>

                    <article class="meisterschaft-stat">

                        <strong id="stat-teams">
                            –
                        </strong>

                        <span>
                            Teams
                        </span>

                    </article>

                    <article class="meisterschaft-stat">

                        <strong id="stat-rennen">
                            –
                        </strong>

                        <span>
                            Rennen
                        </span>

                    </article>

                    <article class="meisterschaft-stat">

                        <strong id="stat-fortschritt">
                            –
                        </strong>

                        <span>
                            Saisonfortschritt
                        </span>

                    </article>

                </div>

            </div>

        </section>

        <section class="meisterschaft-toolbar">

            <div class="container">

                <div class="toolbar">

                    <input
                        id="meisterschaft-suche"
                        type="search"
                        autocomplete="off"
                        placeholder="Fahrer, Team oder Fahrzeug..."
                    >

                </div>

            </div>

        </section>

        <section class="meisterschaft-content">

            <div class="container">

                <div
                    id="meisterschaft-grid"
                    class="meisterschaft-grid"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="text-center text-light py-5">
                        Meisterschaft wird geladen...
                    </div>

                </div>

                <div
                    id="keine-eintraege"
                    class="keine-eintraege"
                    hidden
                >
                    Keine Fahrer gefunden.
                </div>

            </div>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- Reihenfolge unbedingt beibehalten -->

    <script src="assets/js/gtm-data.js"></script>
    <script src="assets/js/gtm-utils.js"></script>
    <script src="assets/js/gtm-ui.js"></script>
    <script src="assets/js/gtm-page.js"></script>

    <script src="assets/js/main.js"></script>
    <script src="assets/js/meisterschaft.js"></script>

</body>

</html>
