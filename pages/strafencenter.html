<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <base href="../">

    <title>GTM Control Center | Strafencenter</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/strafencenter.css">
</head>

<body>

    <header id="site-navbar"></header>

    <main class="strafencenter-page">

        <section class="strafencenter-hero">

            <div class="container">

                <p class="strafencenter-eyebrow">
                    German Touring Masters
                </p>

                <h1>
                    Strafencenter
                </h1>

                <p class="strafencenter-intro">
                    Öffentliche Übersicht aller aktuellen und abgeschlossenen
                    Entscheidungen der Rennleitung.
                </p>

            </div>

        </section>

        <section class="strafencenter-statistik">

            <div class="container">

                <div class="strafencenter-statistik-grid">

                    <article class="strafencenter-statistik-karte">

                        <strong id="strafen-gesamt">
                            –
                        </strong>

                        <span>
                            Entscheidungen
                        </span>

                    </article>

                    <article class="strafencenter-statistik-karte">

                        <strong id="strafen-aktiv">
                            –
                        </strong>

                        <span>
                            Aktive Strafen
                        </span>

                    </article>

                    <article class="strafencenter-statistik-karte">

                        <strong id="strafen-sperren">
                            –
                        </strong>

                        <span>
                            Rennsperren
                        </span>

                    </article>

                    <article class="strafencenter-statistik-karte">

                        <strong id="strafen-punkte">
                            –
                        </strong>

                        <span>
                            Strafpunkte gesamt
                        </span>

                    </article>

                </div>

            </div>

        </section>

        <section class="strafencenter-filterbereich">

            <div class="container">

                <div class="strafencenter-toolbar">

                    <label class="strafencenter-suche">

                        <span>
                            Eintrag suchen
                        </span>

                        <input
                            id="strafen-suche"
                            type="search"
                            autocomplete="off"
                            placeholder="Fahrer, Startnummer, Team oder Vorfall"
                        >

                    </label>

                    <label class="strafencenter-filter">

                        <span>
                            Status
                        </span>

                        <select id="strafen-status-filter">

                            <option value="">
                                Alle Einträge
                            </option>

                            <option value="aktiv">
                                Aktiv
                            </option>

                            <option value="erledigt">
                                Erledigt
                            </option>

                        </select>

                    </label>

                    <label class="strafencenter-filter">

                        <span>
                            Strafart
                        </span>

                        <select id="strafen-art-filter">

                            <option value="">
                                Alle Strafarten
                            </option>

                            <option value="verwarnung">
                                Verwarnung
                            </option>

                            <option value="strafpunkte">
                                Strafpunkte
                            </option>

                            <option value="rennssperre">
                                Rennsperre
                            </option>

                            <option value="disqualifikation">
                                Disqualifikation
                            </option>

                        </select>

                    </label>

                    <label class="strafencenter-filter">

                        <span>
                            Sortierung
                        </span>

                        <select id="strafen-sortierung">

                            <option value="datum">
                                Datum
                            </option>

                            <option value="fahrer">
                                Fahrer
                            </option>

                            <option value="punkte">
                                Strafpunkte
                            </option>

                            <option value="status">
                                Status
                            </option>

                        </select>

                    </label>

                </div>

            </div>

        </section>

        <section class="strafencenter-inhalt">

            <div class="container">

                <div
                    id="strafen-grid"
                    class="strafen-grid"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="text-center text-light py-5">
                        Strafendaten werden geladen …
                    </div>

                </div>

                <div
                    id="keine-strafen"
                    class="keine-strafen"
                    hidden
                >
                    Keine passenden Einträge gefunden.
                </div>

            </div>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="assets/js/gtm-data.js"></script>
    <script src="assets/js/gtm-utils.js"></script>
    <script src="assets/js/gtm-ui.js"></script>
    <script src="assets/js/gtm-page.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/strafencenter.js"></script>

</body>

</html>
