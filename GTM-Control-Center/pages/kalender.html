<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <base href="../">

    <title>GTM Control Center | Kalender</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/kalender.css">
</head>

<body>

    <header id="site-navbar"></header>

    <main class="kalender-page">

        <section class="kalender-hero">

            <div class="container">

                <p class="kalender-eyebrow">
                    German Touring Masters
                </p>

                <h1>
                    Rennkalender
                </h1>

                <p class="kalender-intro">
                    Alle Renntermine der aktuellen GTM Masters Saison
                    mit Strecke, Datum und Veranstaltungsstatus.
                </p>

            </div>

        </section>

        <section class="kalender-statistik">

            <div class="container">

                <div class="kalender-statistik-grid">

                    <article class="kalender-statistik-karte">

                        <strong id="kalender-rennen-gesamt">
                            –
                        </strong>

                        <span>
                            Rennen gesamt
                        </span>

                    </article>

                    <article class="kalender-statistik-karte">

                        <strong id="kalender-abgeschlossen">
                            –
                        </strong>

                        <span>
                            Abgeschlossen
                        </span>

                    </article>

                    <article class="kalender-statistik-karte">

                        <strong id="kalender-verbleibend">
                            –
                        </strong>

                        <span>
                            Verbleibend
                        </span>

                    </article>

                    <article class="kalender-statistik-karte">

                        <strong id="kalender-naechster-lauf">
                            –
                        </strong>

                        <span>
                            Nächster Lauf
                        </span>

                    </article>

                </div>

            </div>

        </section>

        <section class="kalender-filterbereich">

            <div class="container">

                <div class="kalender-toolbar">

                    <label class="kalender-suche">

                        <span>
                            Strecke suchen
                        </span>

                        <input
                            id="kalender-suche"
                            type="search"
                            autocomplete="off"
                            placeholder="Strecke oder Datum"
                        >

                    </label>

                    <label class="kalender-filter">

                        <span>
                            Status
                        </span>

                        <select id="kalender-status-filter">

                            <option value="">
                                Alle Rennen
                            </option>

                            <option value="abgeschlossen">
                                Abgeschlossen
                            </option>

                            <option value="aktuell">
                                Aktuell
                            </option>

                            <option value="nächster">
                                Nächster Lauf
                            </option>

                            <option value="bevorstehend">
                                Bevorstehend
                            </option>

                        </select>

                    </label>

                    <label class="kalender-filter">

                        <span>
                            Sortierung
                        </span>

                        <select id="kalender-sortierung">

                            <option value="laufnummer">
                                Laufnummer
                            </option>

                            <option value="datum">
                                Datum
                            </option>

                            <option value="status">
                                Status
                            </option>

                            <option value="strecke">
                                Strecke
                            </option>

                        </select>

                    </label>

                </div>

            </div>

        </section>

        <section class="kalender-inhalt">

            <div class="container">

                <div
                    id="kalender-grid"
                    class="kalender-grid"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="text-center text-light py-5">
                        Rennkalender wird geladen …
                    </div>

                </div>

                <div
                    id="keine-rennen"
                    class="keine-rennen"
                    hidden
                >
                    Keine passenden Rennen gefunden.
                </div>

            </div>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="assets/js/gtm-data.js"></script>
    <script src="assets/js/gtm-utils.js"></script>
    <script src="assets/js/gtm-ui.js"></script>
    <script src="assets/js/gtm-page.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/kalender.js"></script>

</body>

</html>
