<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <base href="../">

    <title>GTM Control Center | Startnummern</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/navbar.css">
    <link rel="stylesheet" href="assets/css/startnummern.css">
</head>

<body>

    <header id="site-navbar"></header>

    <main class="startnummern-page">

        <section class="startnummern-hero">

            <div class="container">

                <p class="startnummern-eyebrow">
                    German Touring Masters
                </p>

                <h1>
                    Startnummern
                </h1>

                <p class="startnummern-intro">
                    Übersicht aller vergebenen und verfügbaren Startnummern
                    der German Touring Masters.
                </p>

            </div>

        </section>

        <section class="startnummern-statistik">

            <div class="container">

                <div class="startnummern-statistik-grid">

                    <article class="startnummern-statistik-karte">

                        <strong id="startnummern-gesamt">
                            –
                        </strong>

                        <span>
                            Nummern gesamt
                        </span>

                    </article>

                    <article class="startnummern-statistik-karte">

                        <strong id="startnummern-vergeben">
                            –
                        </strong>

                        <span>
                            Vergeben
                        </span>

                    </article>

                    <article class="startnummern-statistik-karte">

                        <strong id="startnummern-frei">
                            –
                        </strong>

                        <span>
                            Verfügbar
                        </span>

                    </article>

                    <article class="startnummern-statistik-karte">

                        <strong id="startnummern-hoechste">
                            –
                        </strong>

                        <span>
                            Höchste Nummer
                        </span>

                    </article>

                </div>

            </div>

        </section>

        <section class="startnummern-filterbereich">

            <div class="container">

                <div class="startnummern-toolbar">

                    <label class="startnummern-suche">

                        <span>
                            Startnummer suchen
                        </span>

                        <input
                            id="startnummern-suche"
                            type="search"
                            autocomplete="off"
                            placeholder="Nummer, Fahrer, Team oder Fahrzeug"
                        >

                    </label>

                    <label class="startnummern-filter">

                        <span>
                            Status
                        </span>

                        <select id="startnummern-status-filter">

                            <option value="">
                                Alle Nummern
                            </option>

                            <option value="vergeben">
                                Vergeben
                            </option>

                            <option value="frei">
                                Verfügbar
                            </option>

                        </select>

                    </label>

                    <label class="startnummern-filter">

                        <span>
                            Team
                        </span>

                        <select id="startnummern-team-filter">

                            <option value="">
                                Alle Teams
                            </option>

                        </select>

                    </label>

                    <label class="startnummern-filter">

                        <span>
                            Sortierung
                        </span>

                        <select id="startnummern-sortierung">

                            <option value="nummer">
                                Startnummer
                            </option>

                            <option value="fahrer">
                                Fahrer
                            </option>

                            <option value="team">
                                Team
                            </option>

                            <option value="status">
                                Status
                            </option>

                        </select>

                    </label>

                </div>

            </div>

        </section>

        <section class="startnummern-inhalt">

            <div class="container">

                <div
                    id="startnummern-grid"
                    class="startnummern-grid"
                    aria-live="polite"
                    aria-busy="true"
                >

                    <div class="text-center text-light py-5">
                        Startnummern werden geladen …
                    </div>

                </div>

                <div
                    id="keine-startnummern"
                    class="keine-startnummern"
                    hidden
                >
                    Keine passenden Startnummern gefunden.
                </div>

            </div>

        </section>

    </main>

    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
    ></script>

    <script src="assets/js/gtm-data.js"></script>
    <script src="assets/js/gtm-utils.js"></script>
    <script src="assets/js/gtm-ui.js"></script>
    <script src="assets/js/gtm-page.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/startnummern.js"></script>

</body>

</html>
